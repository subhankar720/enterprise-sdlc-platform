[project]
name = "python-fastapi-service"
version = "0.1.0"
description = "Local-first FastAPI service for the enterprise SDLC platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2.0",
    "httpx2>=2.16.2,<3.0.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_api"]

[tool.ruff.lint.isort]
known-first-party = ["health_api"]
